name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: projects/aws-devops-project
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up Java
        uses: actions/setup-java@ad2b38190b15e4d6bdf0c97fb4fca8412226d287 # v5.3.0
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Test and package
        run: mvn -B -ntp -f app/pom.xml verify

      - name: Verify Terraform formatting and syntax
        run: |
          terraform fmt -check -recursive terraform
          for env in dev staging prod; do
            terraform -chdir="terraform/environments/$env" init -backend=false -input=false -lockfile=readonly
            terraform -chdir="terraform/environments/$env" validate
          done

      - name: Validate Kubernetes manifests
        run: |
          for env in dev staging prod; do
            kubectl apply --dry-run=client --validate=strict -f "k8s/$env/"
          done

      - name: Validate Compose configuration
        run: docker compose config --quiet

      - name: Log in to Docker Hardened Images
        uses: docker/login-action@v3
        with:
          registry: dhi.io
          username: ${{ secrets.DHI_USERNAME }}
          password: ${{ secrets.DHI_PASSWORD }}

      - name: Build container image
        run: docker build --file app/Dockerfile --tag aws-devops-backend:ci app

      - name: Scan repository and image for vulnerabilities
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: projects/aws-devops-project
          scanners: vuln,secret,misconfig
          severity: UNKNOWN,LOW,MEDIUM,HIGH,CRITICAL
          exit-code: '1'

      - name: Scan built image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: aws-devops-backend:ci
          scan-type: image
          scanners: vuln
          severity: UNKNOWN,LOW,MEDIUM,HIGH,CRITICAL
          exit-code: '1'
