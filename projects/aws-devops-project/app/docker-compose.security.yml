services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    image: aws-devops-backend:local
    ports:
      - "127.0.0.1:${APP_PORT:-8080}:8080"
    environment:
      PORT: "8080"
      APP_ENV: ${APP_ENV:-dev}
    user: "65532:65532"
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=16m,uid=65532,gid=65532,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 100
    mem_limit: 512m
    cpus: 1.0
    init: true
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/health"]
      interval: 30s
      timeout: 3s
      start_period: 15s
      retries: 3
    # Inject secrets only at runtime, for example via Compose secrets or a protected env file.
    # Do not pass secrets as build args or copy them into the image.
