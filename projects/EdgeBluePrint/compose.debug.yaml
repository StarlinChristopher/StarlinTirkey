services:
  edgeblueprint:
    image: edgeblueprint
    build:
      context: .
      dockerfile: ./Dockerfile
    command: ["sh", "-c", "python -m pip install debugpy -t /tmp && PYTHONPATH=/tmp python -m debugpy --wait-for-client --listen 0.0.0.0:5678 services/telematics-python/main.py"]
    ports:
      - 5678:5678
