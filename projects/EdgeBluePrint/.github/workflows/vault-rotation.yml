name: Rotate Vault application secrets

on:
  workflow_dispatch:
  schedule:
    - cron: '23 2 1 * *'

permissions:
  contents: read
  id-token: write

jobs:
  rotate:
    # This runner must have private-network access to Vault and the deployment host.
    runs-on: [self-hosted, linux, production]
    environment: production
    defaults:
      run:
        working-directory: projects/EdgeBluePrint
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install required tools
        run: sudo apt-get update && sudo apt-get install --yes jq openssl

      - name: Request GitHub OIDC token
        id: oidc
        uses: actions/github-script@v7
        with:
          script: |
            const token = await core.getIDToken(process.env.VAULT_OIDC_AUDIENCE);
            core.setSecret(token);
            core.setOutput('token', token);
        env:
          VAULT_OIDC_AUDIENCE: ${{ vars.VAULT_OIDC_AUDIENCE }}

      - name: Rotate and synchronize Vault secrets
        env:
          VAULT_ADDR: ${{ secrets.VAULT_ADDR }}
          VAULT_JWT_ROLE: ${{ vars.VAULT_JWT_ROLE }}
          VAULT_JWT: ${{ steps.oidc.outputs.token }}
          VAULT_CACERT: ${{ secrets.VAULT_CACERT }}
        run: ./scripts/rotate-vault-secrets.sh
