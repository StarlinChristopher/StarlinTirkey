apiVersion: v1
kind: ServiceAccount
metadata:
  name: edgeblueprint-runtime
  namespace: edgeblueprint
automountServiceAccountToken: false
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: edgeblueprint-runtime
  namespace: edgeblueprint
rules:
  - apiGroups: [""]
    resources: ["pods", "services", "endpoints", "events", "persistentvolumeclaims", "configmaps"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["apps"]
    resources: ["deployments", "replicasets"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: edgeblueprint-runtime
  namespace: edgeblueprint
subjects:
  - kind: ServiceAccount
    name: edgeblueprint-runtime
    namespace: edgeblueprint
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: edgeblueprint-runtime
