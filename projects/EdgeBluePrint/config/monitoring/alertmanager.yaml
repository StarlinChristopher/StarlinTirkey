global:
  resolve_timeout: 5m
  # ALERTMANAGER_WEBHOOK_URL must be supplied through the runtime secret file.
  http_config:
    follow_redirects: false

route:
  receiver: default
  group_by:
    - alertname
    - service
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h

receivers:
  - name: default
    webhook_configs:
      - url_file: /run/secrets/alertmanager_webhook_url
        send_resolved: true

inhibit_rules:
  - source_matchers:
      - severity="critical"
    target_matchers:
      - severity="warning"
    equal:
      - alertname
      - service
