# Load this rule file in Loki Ruler and route the alert through Alertmanager.
# The ingestion service emits JSON logs with message="telemetry search failed"
# and error="Search query is too long".
groups:
  - name: edgeblueprint-ingestion
    interval: 1m
    rules:
      - alert: EdgeBlueprintRepeatedOversizedSearchQueries
        expr: |
          sum(count_over_time({service="node-ingestion"} | json | error="Search query is too long" [5m])) >= 10
        for: 5m
        labels:
          severity: warning
          service: node-ingestion
          category: abuse
        annotations:
          summary: Repeated oversized search queries detected
          description: More than 10 oversized /search queries were rejected within five minutes.
          runbook: Review source IPs at the reverse proxy and verify query-length abuse is not automated.
